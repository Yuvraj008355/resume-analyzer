<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResumeScope: AI resume analyzer and job matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    --bg:#0b0716; --text:#f2effa; --muted:#a79fc0;
    --violet:#7c5cff; --pink:#ff4d8d; --amber:#ffb347; --mint:#3be8b0;
    --glass:rgba(255,255,255,.055); --edge:rgba(255,255,255,.12);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Plus Jakarta Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.55; min-height:100vh; }
  body::before { content:""; position:fixed; inset:0; z-index:-1;
    background: radial-gradient(600px 420px at 12% 8%, rgba(124,92,255,.35), transparent 70%),
                radial-gradient(560px 420px at 92% 20%, rgba(255,77,141,.25), transparent 70%),
                radial-gradient(700px 500px at 60% 105%, rgba(255,179,71,.14), transparent 70%); }
  h1,h2,h3 { font-family:'Unbounded',system-ui,sans-serif; margin:0; letter-spacing:-.02em; }
  button { font:inherit; cursor:pointer; }
  :focus-visible { outline:3px solid var(--mint); outline-offset:3px; }

  .top { display:flex; justify-content:space-between; align-items:center; padding:22px 36px; max-width:1180px; margin:0 auto; }
  .brand { font-family:'Unbounded',sans-serif; font-weight:800; font-size:1.25rem; }
  .brand i { font-style:normal; background:linear-gradient(90deg,var(--violet),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tabs { display:flex; gap:4px; padding:4px; border-radius:99px; background:var(--glass); border:1px solid var(--edge); }
  .tabs button { background:transparent; border:0; color:var(--muted); padding:8px 20px; border-radius:99px; font-weight:600; }
  .tabs button.on { background:#fff; color:#150d2b; }

  .page { max-width:1180px; margin:0 auto; padding:10px 36px 70px; }
  .glass { background:var(--glass); border:1px solid var(--edge); border-radius:22px; padding:26px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }

  .hero { text-align:center; margin:34px auto 40px; max-width:820px; }
  .hero h1 { font-size:clamp(2rem,5.2vw,3.7rem); line-height:1.08; font-weight:800; }
  .hero p { color:var(--muted); font-size:1.1rem; max-width:560px; margin:18px auto 0; }

  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .glass h3 { font-size:1rem; margin-bottom:14px; font-weight:700; }
  .drop { border:2px dashed rgba(255,255,255,.22); border-radius:16px; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; cursor:pointer; transition:border-color .2s, background .2s, box-shadow .2s; }
  .drop:hover, .drop.over { border-color:var(--violet); background:rgba(124,92,255,.12); box-shadow:0 0 40px rgba(124,92,255,.25); }
  .drop strong { font-size:1.05rem; } .drop span { color:var(--muted); font-size:.9rem; margin-top:4px; }
  .picked { display:flex; align-items:center; gap:12px; min-height:210px; flex-direction:column; justify-content:center; text-align:center; }
  .picked .nm { font-weight:600; word-break:break-all; }
  .linkbtn { background:transparent; border:1px solid var(--edge); color:var(--muted); padding:7px 16px; border-radius:99px; }
  textarea { width:100%; min-height:210px; resize:vertical; background:rgba(0,0,0,.25); color:var(--text); border:1px solid var(--edge); border-radius:14px; padding:14px; font:inherit; }
  textarea::placeholder { color:#7d7499; }

  .cta { text-align:center; margin-top:28px; }
  .go { background:linear-gradient(100deg,var(--violet),var(--pink)); color:#fff; border:0; padding:17px 44px; border-radius:16px; font-weight:700; font-size:1.05rem; box-shadow:0 10px 40px rgba(255,77,141,.35); transition:transform .15s, box-shadow .15s; }
  .go:hover { transform:translateY(-2px); box-shadow:0 14px 46px rgba(255,77,141,.5); }
  .go:disabled { opacity:.7; cursor:wait; transform:none; }
  .err { display:inline-block; margin-top:18px; background:rgba(255,77,141,.14); border:1px solid rgba(255,77,141,.4); color:#ffc2d6; padding:11px 18px; border-radius:12px; }

  .spin { width:18px; height:18px; border:3px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; display:inline-block; vertical-align:-3px; margin-right:10px; animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }

  /* Results */
  .score-card { display:flex; gap:40px; align-items:center; flex-wrap:wrap; padding:34px; margin-bottom:20px; }
  .gauge { filter:drop-shadow(0 0 22px rgba(255,77,141,.45)); flex:none; }
  .score-card h2 { font-size:clamp(1.6rem,3.4vw,2.4rem); font-weight:800; }
  .score-card .sub { color:var(--muted); margin-top:8px; max-width:520px; }
  .note { margin-top:14px; background:rgba(255,179,71,.13); border:1px solid rgba(255,179,71,.4); color:#ffe2b3; padding:10px 14px; border-radius:12px; font-size:.92rem; }
  .gt { font-weight:600; margin:18px 0 8px; font-size:.95rem; }

  .chips { display:flex; flex-wrap:wrap; gap:7px; }
  .chip { padding:5px 13px; border-radius:99px; font-size:.86rem; font-weight:600; background:rgba(255,255,255,.09); color:#e6e1f5; }
  .chip.ok { background:rgba(59,232,176,.15); color:var(--mint); }
  .chip.bad { background:rgba(255,77,141,.16); color:#ff8fb6; }
  .muted { color:var(--muted); }

  .job { padding:18px 0; border-top:1px solid var(--edge); }
  .job:first-of-type { border-top:0; padding-top:4px; }
  .jh { display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
  .jt { font-weight:700; font-size:1.05rem; }
  .js { font-family:'Unbounded',sans-serif; font-weight:700; }
  .bar { height:9px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; margin:10px 0 12px; }
  .bar > div { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--violet),var(--pink)); }

  .tips { list-style:none; padding:0; margin:0; }
  .tips li { padding:11px 14px 11px 16px; border-left:3px solid var(--amber); background:rgba(255,179,71,.09); border-radius:0 12px 12px 0; margin-bottom:9px; }
  .mt { margin-top:20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:12px 8px; border-bottom:1px solid var(--edge); }
  th { color:var(--muted); font-weight:500; font-size:.9rem; }

  @media (max-width:860px) {
    .grid2 { grid-template-columns:1fr; } .top, .page { padding-left:18px; padding-right:18px; }
    .score-card { gap:20px; justify-content:center; text-align:center; }
  }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } .go { transition:none; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function useCount(target) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { setN(target); return; }
    let raf, start;
    const step = t => {
      if (start === undefined) start = t;
      const p = Math.min((t - start) / 1100, 1);
      setN(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return n;
}

function band(s) {
  if (s >= 75) return "Excellent match";
  if (s >= 50) return "Good match";
  if (s >= 30) return "Moderate match";
  return "Low match";
}

function Gauge({ value }) {
  const n = useCount(value), r = 88, c = 2 * Math.PI * r;
  return (
    <svg className="gauge" viewBox="0 0 220 220" width="230" height="230" role="img" aria-label={"Score " + Math.round(value) + " percent"}>
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor="#7c5cff" /><stop offset=".55" stopColor="#ff4d8d" /><stop offset="1" stopColor="#ffb347" />
        </linearGradient>
      </defs>
      <circle cx="110" cy="110" r={r} fill="none" stroke="rgba(255,255,255,.08)" strokeWidth="14" />
      <circle cx="110" cy="110" r={r} fill="none" stroke="url(#g)" strokeWidth="14" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c * (1 - n / 100)} transform="rotate(-90 110 110)" />
      <text x="110" y="124" textAnchor="middle" fontSize="48" fontWeight="800" fill="#fff" fontFamily="Unbounded, sans-serif">
        {Math.round(n)}<tspan fontSize="22">%</tspan>
      </text>
    </svg>
  );
}

const Chips = ({ items, kind }) =>
  items.length
    ? <div className="chips">{items.map(s => <span key={s} className={"chip " + (kind || "")}>{s}</span>)}</div>
    : <span className="muted">None</span>;

function Results({ data, onReset }) {
  const { ats, jobs, skills, suggestions, categories } = data;
  const score = ats ? ats.score : jobs[0].score;
  return (
    <>
      {data.ocr_used && (
        <div className="note" style={{ marginBottom: 16 }}>
          This file was scanned, so we read it with OCR. If a skill is missing, check that the scan is clear.
        </div>
      )}

      <section className="glass score-card">
        <Gauge value={score} />
        <div style={{ flex: 1, minWidth: 260 }}>
          <h2>{band(score)}</h2>
          <div className="sub">
            {ats
              ? <>Compared with your job description. Text similarity {ats.text_score}% ({ats.method}){ats.skill_score !== null && <>, skill match {ats.skill_score}%</>}.</>
              : <>Best fit from our job list: {jobs[0].title}. Add a job description to get an ATS score for one specific role.</>}
          </div>
          {ats && ats.skill_score === null && (
            <div className="note">No known skills were found in this job description, so the score uses text similarity only. Paste the full description for a better result.</div>
          )}
          {ats && (<>
            <div className="gt">Skills you have that the job asks for</div><Chips items={ats.matched} kind="ok" />
            <div className="gt">Skills the job asks for that you are missing</div><Chips items={ats.missing} kind="bad" />
          </>)}
        </div>
      </section>

      {categories && (
        <section className="glass" style={{ marginBottom: 20 }}>
          <h3>Predicted career category</h3>
          {categories.map((c, i) => (
            <div key={c.category} style={{ marginTop: i ? 12 : 0 }}>
              <div className="jh">
                <span className={i === 0 ? "jt" : "muted"}>{c.category}</span>
                <span className="js">{c.confidence}%</span>
              </div>
              <div className="bar"><div style={{ width: c.confidence + "%" }} /></div>
            </div>
          ))}
        </section>
      )}

      <div className="grid2">
        <section className="glass">
          <h3>Skills found in your resume ({skills.length})</h3>
          <Chips items={skills} />
        </section>
        <section className="glass">
          <h3>How to improve your resume</h3>
          <ul className="tips">{suggestions.map(t => <li key={t}>{t}</li>)}</ul>
        </section>
      </div>

      <section className="glass mt">
        <h3>Jobs that fit your resume</h3>
        {jobs.map(j => (
          <div className="job" key={j.title}>
            <div className="jh">
              <div><span className="jt">{j.title}</span> <span className="muted">at {j.company}</span></div>
              <div className="js">{j.score}%</div>
            </div>
            <div className="bar"><div style={{ width: j.score + "%" }} /></div>
            {j.missing.length > 0 && (<><div className="muted" style={{ marginBottom: 7, fontSize: ".9rem" }}>Skills to learn for this role</div><Chips items={j.missing} kind="bad" /></>)}
          </div>
        ))}
      </section>

      <div className="cta"><button className="go" onClick={onReset}>Analyze another resume</button></div>
    </>
  );
}

function History() {
  const [rows, setRows] = useState(null);
  useEffect(() => { fetch("/api/history").then(r => r.json()).then(setRows).catch(() => setRows([])); }, []);
  return (
    <section className="glass mt">
      <h3>Past analyses</h3>
      {rows === null ? <span className="muted">Loading...</span>
        : rows.length === 0 ? <span className="muted">Nothing here yet. Analyze a resume and it will show up here.</span>
        : (<table>
            <thead><tr><th>File</th><th>Score</th><th>Best job</th><th>Date</th></tr></thead>
            <tbody>{rows.map(r => (<tr key={r.id}><td>{r.filename}</td><td>{r.ats_score}%</td><td>{r.top_job}</td><td>{r.created_at}</td></tr>))}</tbody>
          </table>)}
    </section>
  );
}

function App() {
  const [tab, setTab] = useState("analyze");
  const [file, setFile] = useState(null);
  const [jd, setJd] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [data, setData] = useState(null);
  const [over, setOver] = useState(false);
  const inputRef = useRef(null);

  function pick(f) {
    if (!f) return;
    if (!/\.(pdf|png|jpe?g)$/i.test(f.name)) { setError("Upload a PDF, PNG or JPG file."); return; }
    setError(""); setFile(f);
  }

  async function submit() {
    setError("");
    if (!file) { setError("Choose your resume file first."); return; }
    const fd = new FormData();
    fd.append("resume", file);
    fd.append("job_description", jd);
    setLoading(true);
    try {
      const res = await fetch("/api/analyze", { method: "POST", body: fd });
      const json = await res.json();
      if (!res.ok) setError(json.error || "Something went wrong. Try again.");
      else setData(json);
    } catch {
      setError("Could not reach the server. Check that python app.py is running.");
    }
    setLoading(false);
  }

  function reset() { setData(null); setFile(null); setJd(""); setError(""); }

  return (
    <>
      <header className="top">
        <div className="brand">Resume<i>Scope</i></div>
        <nav className="tabs">
          <button className={tab === "analyze" ? "on" : ""} onClick={() => setTab("analyze")}>Analyze</button>
          <button className={tab === "history" ? "on" : ""} onClick={() => setTab("history")}>History</button>
        </nav>
      </header>

      <main className="page">
        {tab === "history" ? <History /> : data ? <Results data={data} onReset={reset} /> : (
          <>
            <div className="hero">
              <h1>Know your resume's score before the recruiter does.</h1>
              <p>Upload your resume, paste a job description, and see your ATS score, missing skills and the jobs that suit you.</p>
            </div>

            <div className="grid2">
              <section className="glass">
                <h3>Your resume</h3>
                {file ? (
                  <div className="picked">
                    <div className="nm">{file.name}</div>
                    <button className="linkbtn" onClick={() => setFile(null)}>Choose a different file</button>
                  </div>
                ) : (
                  <div className={"drop" + (over ? " over" : "")} tabIndex="0" role="button"
                    onClick={() => inputRef.current.click()}
                    onKeyDown={e => (e.key === "Enter" || e.key === " ") && inputRef.current.click()}
                    onDragOver={e => { e.preventDefault(); setOver(true); }}
                    onDragLeave={() => setOver(false)}
                    onDrop={e => { e.preventDefault(); setOver(false); pick(e.dataTransfer.files[0]); }}>
                    <strong>Drop your resume here</strong>
                    <span>or click to browse. PDF, scanned PDF, PNG or JPG, up to 5 MB.</span>
                  </div>
                )}
                <input ref={inputRef} type="file" accept=".pdf,.png,.jpg,.jpeg" hidden onChange={e => pick(e.target.files[0])} />
              </section>

              <section className="glass">
                <h3>Job description <span className="muted" style={{ fontWeight: 400 }}>(optional, needed for the ATS score)</span></h3>
                <textarea value={jd} onChange={e => setJd(e.target.value)} placeholder="Paste the full job description here" />
              </section>
            </div>

            <div className="cta">
              <button className="go" onClick={submit} disabled={loading}>
                {loading && <span className="spin" />}{loading ? "Analyzing..." : "Analyze resume"}
              </button>
              {error && <div><span className="err" role="alert">{error}</span></div>}
            </div>
          </>
        )}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
